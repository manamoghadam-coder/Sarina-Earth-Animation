<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الفبای سامان</title>
<style>
:root{--bg:#fff4d6;--ink:#1f2a5c;--accent:#f2a900;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:#222;font-family:Tahoma,"Vazirmatn","Noto Naskh Arabic",sans-serif;display:flex;justify-content:center;min-height:100vh}
#stage{width:min(100vw,56.25vh*1,420px);width:min(100vw,calc(100vh*9/16));aspect-ratio:9/16;background:linear-gradient(#ffe9a8,#fff4d6);position:relative;overflow:hidden;display:flex;flex-direction:column}
#top{flex:0 0 40%;display:flex;align-items:center;justify-content:center;gap:4%;padding:0 5%}
#card{background:var(--card);border-radius:5vmin;box-shadow:0 1.2vmin 0 var(--accent);width:44%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(30vw,17vh);color:var(--ink);font-weight:bold;line-height:1}
#info{flex:1;text-align:center;color:var(--ink)}
#name{font-size:min(7vw,4vh);font-weight:bold}
#emoji{font-size:min(15vw,8.5vh);line-height:1.1}
#word{font-size:min(6vw,3.4vh)}
#photoWrap{flex:1;position:relative;overflow:hidden;border-radius:4vmin 4vmin 0 0;margin:0 3%}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;transform-origin:50% 100%}
#row{position:absolute;bottom:1%;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.6vmin;padding:0 3%;direction:rtl}
.dot{width:3.2vmin;height:3.2vmin;border-radius:50%;background:#ffffff99;font-size:2vmin;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.dot.on{background:var(--accent);transform:scale(1.4)}
#btn{position:absolute;inset:0;background:#000a;color:#fff;border:0;font:inherit;font-size:6vmin;cursor:pointer;z-index:5}
#ctl{position:absolute;top:1.5%;left:3%;z-index:4;display:flex;gap:6px;direction:ltr}
#ctl button{border:0;border-radius:2vmin;padding:1vmin 2vmin;background:#fff;color:var(--ink);font:inherit;font-size:2.6vmin}
@keyframes pop{0%{transform:scale(.3) rotate(-10deg)}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.pop{animation:pop .35s ease-out}
</style></head><body>

<script>
const L=[["ا","الف","💧","آب"],["ب","بِ","🎈","بادکنک"],["پ","پِ","🦋","پروانه"],["ت","تِ","⚽","توپ"],["ث","ثِ","💰","ثروت"],["ج","جیم","🐥","جوجه"],["چ","چِ","🍵","چای"],["ح","حِ","🐌","حلزون"],["خ","خِ","🐻","خرس"],["د","دال","✋","دست"],["ذ","ذال","🌽","ذرت"],["ر","رِ","🦊","روباه"],["ز","زِ","🦒","زرافه"],["ژ","ژِ","🍮","ژله"],["س","سین","🍎","سیب"],["ش","شین","🦁","شیر"],["ص","صاد","🧼","صابون"],["ض","ضاد","❌","ضربدر"],["ط","طا","🦜","طوطی"],["ظ","ظا","🍽️","ظرف"],["ع","عین","🍯","عسل"],["غ","غین","🦢","غاز"],["ف","فِ","🐘","فیل"],["ق","قاف","🫖","قوری"],["ک","کاف","📖","کتاب"],["گ","گاف","🌸","گل"],["ل","لام","🍋","لیمو"],["م","میم","🌙","ماه"],["ن","نون","🍞","نان"],["و","واو","🎻","ویولن"],["ه","هِ","🍑","هلو"],["ی","یِ","🧊","یخ"]];
const $=id=>document.getElementById(id);
const row=$('row');L.forEach((l,i)=>{const d=document.createElement('div');d.className='dot';d.textContent=l[0];row.appendChild(d)});
let bpm=96,i=0,beat=0,timer=null,ac=null,playing=false;
let voice=null;function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/^fa/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';if(voice)u.voice=voice;u.rate=.8;u.pitch=1.3;speechSynthesis.cancel();speechSynthesis.speak(u)}
function tick(f,type,dur,g){const o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(g,ac.currentTime);a.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(a).connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}
function show(k){const [c,n,e,w]=L[k];$('card').textContent=c;$('name').textContent=n;$('emoji').textContent=e;$('word').textContent=w;
 ['card','emoji'].forEach(x=>{const el=$(x);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')});
 document.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===k));
 say(c==='ا'?'الف':n.replace(/[ِ]/g,'')+(n.length<3?'':'')+'، '+w)}
function step(){ // 4 beats per letter: 1 = letter, 3 = word
 const b=beat%4;
 tick(b===0?880:660,'triangle',.12,.25); if(b===2)tick(180,'sine',.18,.4);
 if(b===0){show(i);i=(i+1)%L.length}
 const p=$('photo');p.animate([{transform:'rotate(0) scaleY(1)'},{transform:`rotate(${b%2?1.6:-1.6}deg) scaleY(1.025)`},{transform:'rotate(0) scaleY(1)'}],{duration:60000/bpm*.9,easing:'ease-out'});
 beat++}
function start(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();stop();playing=true;timer=setInterval(step,60000/bpm);step()}
function stop(){clearInterval(timer);playing=false}
$('btn').onclick=()=>{$('btn').style.display='none';start()};
$('slow').onclick=()=>{bpm=Math.max(60,bpm-12);if(playing)start()};
$('fast').onclick=()=>{bpm=Math.min(140,bpm+12);if(playing)start()};
$('stop').onclick=()=>{if(playing){stop();$('stop').textContent='▶'}else{start();$('stop').textContent='⏸'}};
</script></body></html>
