# پشت Nginx (گواهی با certbot). برنامه را با ERP_TRUST_PROXY=1 و HOST=127.0.0.1 اجرا کنید.
server {
    listen 80;
    server_name erp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.example.com;
    # ssl_certificate / ssl_certificate_key را certbot اضافه می‌کند

    client_max_body_size 12m;          # پیوست‌ها تا ۱۰ مگابایت

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # مهم: مقدار ارسالی کلاینت را نادیده بگیرید و فقط آدرس واقعی را بنویسید (نه $proxy_add_x_forwarded_for)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
